name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # pnpm 11 requires Node 22.13+ to run, so the build/test toolchain uses
        # Node 22. LocalAnt's runtime still supports Node 20.10+ (see engines);
        # end users install the prebuilt dist with plain `npm`/`node`.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install ffmpeg / ffprobe
        shell: bash
        run: |
          if command -v ffprobe >/dev/null 2>&1; then
            exit 0
          fi
          case "$RUNNER_OS" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y ffmpeg
              ;;
            macOS)
              brew install ffmpeg
              ;;
            Windows)
              choco install ffmpeg -y
              ;;
          esac

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck + Build
        run: pnpm build

      - name: Test (security + unit + integration)
        run: pnpm test

  coverage:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install ffmpeg / ffprobe
        shell: bash
        run: |
          if command -v ffprobe >/dev/null 2>&1; then
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Test with coverage
        run: pnpm test:coverage
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  package-smoke:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: CLI smoke (doctor + help)
        run: |
          node packages/cli/dist/bin.js --help
          node packages/cli/dist/bin.js doctor || true
      - name: Gateway smoke
        run: |
          mkdir -p .tmp-tests
          node scripts/smoke.mjs
